# Validation Errors
error.validation = Məlumatların doğrulanması zamanı xəta baş verdi
error.invalid_field = Daxil edilən məlumat yanlışdır
error.missing_field = Zəruri məlumat daxil edilməyib
error.out_of_range = Daxil edilən məlumat tələb olunan diapazondan kənardır
error.invalid_format = Yanlış məlumat formatı

# Authentication Errors
error.unauthorized = Davam etmək üçün daxil olun
error.invalid_credentials = İstifadəçi adı və ya şifrə yanlışdır
error.token_expired = Oturum müddəti başa çatdı. Zəhmət olmasa yenidən daxil olun
error.account_locked = Hesabınız müvəqqəti olaraq bloklanıb
error.account_disabled = Hesabınız qeyri-aktivdir

# Authorization Errors
error.forbidden = Bu əməliyyatı yerinə yetirmək üçün icazəniz yoxdur
error.access_denied = Giriş qadağandır

# Request Format Errors
error.invalid_request = Yanlış sorğu
error.invalid_json_format = Sorğu formatı düzgün deyil
error.unsupported_media_type = Dəstəklənməyən media növü
error.method_not_allowed = Bu metod dəstəklənmir

# Server Errors
error.internal_server_error = Baş vermiş texniki xəta ilə bağlı üzr istəyirik. Qısa müddət sonra yenidən cəhd edin
error.service_unavailable = Xidmət müvəqqəti olaraq əlçatan deyil
error.unexpected = Gözlənilməz xəta baş verdi

# Resource Errors
error.resource_not_found = Məlumat tapılmadı
error.resource_already_exists = Bu məlumat artıq mövcuddur
error.resource_conflict = Məlumat uyğunsuzluğu baş verdi

# Rate Limiting Errors
error.too_many_requests = Çox sayda sorğu göndərilib. Zəhmət olmasa bir qədər gözləyin
error.rate_limit_exceeded = Gündəlik limit keçilib

# Service Specific Errors
error.duplicate_mobile = Bu mobil nömrə artıq qeydiyyatdan keçib
error.duplicate_email = Bu email artıq qeydiyyatdan keçib
error.account_deactivated = Hesabınız deaktivilib
error.reactivation_required = Giriş üçün əlavə təsdiqləmə tələb olunur. Təhlükəsizlik kodunu daxil edin.
error.password_min_length = Şifrə ən azı 8 simvoldan ibarət olmalıdır
error.password_must_be_different = Yeni şifrə köhnə şifrədən fərqli olmalıdır
error.password_reset_success = Şifrə uğurla sıfırlandı.
error.invalid_google_token = Google girişi zamanı xəta baş verdi
error.invalid_apple_token = Apple girişi zamanı xəta baş verdi
error.apple_public_key_error = Apple xidməti ilə əlaqə qurulmadı
error.otp_rate_limited = Çox sayda cəhd. Zəhmət olmasa gözləyin
error.transaction_error = Əməliyyat zamanı xəta baş verdi
error.data_integrity = Daxil edilən məlumatların tamlığı ilə bağlı xəta baş verdi
error.null_constraint = Zəruri məlumatlar çatışmır
error.user_not_found = İstifadəçi tapılmadı
error.invalid_otp_purpose = Yanlış OTP təyinatı
error.missing_email = E-poçt təqdim edilməlidir
error.missing_mobile = Mobil nömrə təqdim edilməlidir
# OTP Messages
error.otp_sent = Təsdiq kodu göndərildi.
error.otp_sent_if_exists = Əgər qeyd olunan mobil nömrə sistemdə mövcuddursa, təsdiq kodu göndərildi.
error.invalid_otp = Yanlış OTP kodu
error.otp_locked = Həddindən artıq sayda uğursuz cəhd səbəbindən OTP sessiyası bloklanıb. Zəhmət olmasa yeni kod sorğulayın.
error.otp_already_verified = OTP kodu artıq istifadə edilib. Zəhmət olmasa yenisini sorğulayın.
error.otp_verified = OTP uğurla təsdiqləndi.
error.otp_rate_limit_seconds = Yenidən OTP sorğulamadan əvvəl {0} saniyə gözləyin.
error.otp_rate_limit_minutes = Həddindən artıq OTP sorğusu. Zəhmət olmasa {0} dəqiqədən sonra yenidən yoxlayın.
error.otp_rate_limit_generic = Həddindən artıq sorğu. Zəhmət olmasa bir az sonra yenidən yoxlayın.
