# Validation Errors
error.validation = Məlumatların doğrulanması zamanı xəta baş verdi
error.validation.invalid_field = Daxil edilən məlumat etibarsızdır
error.validation.missing_field = Zəruri məlumat təqdim edilməyib
error.validation.out_of_range = Daxil edilən məlumat icazə verilən diapazondan kənardadır
error.validation.invalid_format = Məlumatın formatı yanlışdır
error.validation.null_constraint = Zəruri məlumatlar çatışmır

# Authentication Errors
error.auth.unauthorized = Davam etmək üçün daxil olun
error.auth.invalid_credentials = Giriş məlumatları yanlışdır
error.auth.token_expired = Oturumun müddəti bitdi. Zəhmət olmasa yenidən daxil olun
error.auth.account_restricted = Hesaba giriş müvəqqəti olaraq məhdudlaşdırılıb
error.auth.account_inactive = Hesab hazırda aktiv deyil

# Authorization Errors
error.authorization.forbidden = Bu əməliyyatı yerinə yetirmək üçün icazəniz yoxdur
error.authorization.access_denied = Giriş qadağandır

# Request Format Errors
error.request.invalid = Yanlış sorğu
error.request.invalid_json = Sorğunun JSON formatı düzgün deyil
error.request.unsupported_media_type = Dəstəklənməyən media nüvü
error.request.method_not_allowed = Bu HTTP metodu dəstəklənmir
error.request.timeout = Sorğu çox uzun çəkdi

# Server Errors
error.server.internal = Texniki xəta baş verdi. Zəhmət olmasa bir qədər sonra yenidən cəhd edin
error.server.unavailable = Xidmət hazırda əlçatandır
error.server.unexpected = Gözlənilməz xəta baş verdi
error.server.maintenance = Xidmətdə müvəqqəti texniki işlər aparılır

# Resource Errors
error.resource.not_found = Sorğu edilən məlumat tapılmadı
error.resource.already_exists = Bu məlumat artıq müvcuddur
error.resource.conflict = Məlumat uyğunsuzluğu aşkar edildi
error.resource.operation_failed = Təqdim edilən məlumatla əməliyyat həyata keçirilə bilmədi

# Rate Limiting Errors
error.rate_limit.too_many_requests = Çox sayda sorğu göndərilib. Zəhmət olmasa bir qədər gözləyin
error.rate_limit.exceeded = Sorğu limiti keçilib

# Service Specific Errors
error.service.operation_not_allowed = Təqdim edilən məlumatla əməliyyat həyata keçirilə bilmədi
error.service.account_unavailable = Hesab hazırda istifadə üçün əlçatandır
error.service.additional_verification_required = Davam etmək üçün əlavə təsdiqləmə tələb olunur
error.service.password_min_length = Şifrə ən azı 8 simvoldan ibarət olmalıdır
error.service.password_must_be_different = Yeni şifrə əvvəlki şifrədən fərqli olmalıdır
info.service.request_processed = Əgər təqdim edilməli məlumat sistemdə mövcuddursa, sorğu icra edildi
error.service.external_auth_error = Xarici giriş xidməti ilə əlaqə zamanı xəta baş verdi
error.service.external_service_unavailable = Xarici xidmətə qoşulmaq mümkün olmadı
error.service.transaction_error = Əməliyyat zamanı xəta baş verdi
error.service.data_integrity = Məlumatların emalı zamanı xəta baş verdi
error.service.identity_not_verified = Təqdim edilən məlumat doğrulanmadı
error.service.invalid_operation_context = Bu əməliyyat cari kontekstdə icra edilə bilməz
error.service.missing_email = E-poçt təqdim edilməlidir
error.service.missing_mobile = Mobil nömrə təqdim edilməlidir

# OTP Messages
success.otp.sent = Təsdiq kodu göndərildi
success.otp.sent_if_exists = Əgər təqdim edilən məlumat sistemdə mövcuddursa, təsdiq kodu göndərildi
error.otp.invalid = Təsdiq kodu yanlışdır və ya etibarsızdır
error.otp.locked = Çox sayda uğursuz cəhd səbəbindən təsdiq prosesi müvəqqəti məhdudlaşdırılıb
error.otp.already_verified = Təsdiq kodu artıq istifadə olunub
success.otp.verified = Təsdiq uğurla tamamlandı
error.otp.rate_limit_seconds = Yenidən OTP sorğulamadan əvvəl {0} saniyə gözləyin
error.otp.rate_limit_minutes = Həddindən artıq OTP sorğuşu. Zəhmət olmasa {0} dəqiqədən sonra yenidən cəhd edin
error.otp.rate_limit_generic = Həddindən artıq sorğu. Zəhmət olmasa bir az sonra yenidən cəhd edin

# Success Messages
success.auth.logout = Çıxış uğurla tamamlandı
success.password.changed = Şifrə uğurla dəyişdirildi
success.account.deactivated = Hesab uğurla deaktiv edildi
