server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework
  http2:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200
    # Enable URI encoding for proper Swagger URL handling
    uri-encoding: UTF-8
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
  compression:
    enabled: true
    # Lower threshold for earlier compression - benefits Swagger JSON responses
    min-response-size: 1024
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json,text/html,application/xml,application/vnd.oai.openapi+json

spring:
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  messages:
    encoding: UTF-8
  application:
    name: identity-service
  # Database
  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keep-alive-time: 300000
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      pool-name: HikariCP-Identity
      auto-commit: true
      connection-test-query: SELECT 1
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  # JPA
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service.fitnest-dev.svc.cluster.local:9092}
    consumer:
      group-id: identity-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
      linger-ms: 5

  # Jackson
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC
    serialization:
      indent-output: false

  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Security
  security:
    oauth2:
      client:
        registration:
          # Add social login providers if needed
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:500}
            read-timeout: ${FEIGN_READ_TIMEOUT:2000}
            logger-level: BASIC

# SpringDoc OpenAPI (Swagger) - Optimized for fast loading
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
    cache:
      enabled: true
    # Resolve schema refs to reduce JSON size

  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    # Disable syntax highlighting for faster rendering
    syntax-highlight:
      activated: false
    # Disable deep linking for faster initial load
    deep-linking: false
    # Persist authorization to avoid re-entering token
    persist-authorization: true
    # Disable validator badge (external call)
    disable-swagger-default-url: true
    validator-url: none
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false
  # Pre-load OpenAPI spec at startup
  pre-loading-enabled: true

  # Use faster model converters
  model-converters:
    deprecating-converter:
      enabled: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  # Remove expiration if not used
  # expiration: ${JWT_EXPIRATION:86400000}

# OTP Configuration (simplified - remove duplicates)
otp:
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:3}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  rate-limit:
    max-attempts: ${OTP_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${OTP_RATE_LIMIT_WINDOW_MINUTES:15}
    cooldown-seconds: ${OTP_RATE_LIMIT_COOLDOWN_SECONDS:60}
    min-cooldown-seconds: ${OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS:5}
    error-message-threshold-seconds: ${OTP_RATE_LIMIT_ERROR_MESSAGE_THRESHOLD_SECONDS:30}
  key-builder:
    pepper: ${OTP_KEY_BUILDER_PEPPER:change-me-in-production-pepper-123}

# User Service
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8080}

# Application-specific configurations
app:
  # Security
  security:
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
    brute-force:
      max-attempts: 5
      lockout-minutes: 15

  # Cache
  cache:
    ttl:
      user: 300
      roles: 600
      permissions: 1800

  # Rate limiting
  rate-limit:
    enabled: true
    login:
      max-attempts: 5
      window-minutes: 15
    api:
      max-requests: 1000
      window-seconds: 3600
  
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    db: ${APP_WARMUP_DB:true}
    jwks: ${APP_WARMUP_JWKS:false} # Identity is the provider, no need to fetch from itself

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://161.97.183.7,http://localhost}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${KUBERNETES_NAMESPACE:default}

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    az.fitnest: DEBUG
    az.fitnest.identity: ${LOGGING_LEVEL_AZ_FITNEST_IDENTITY:INFO}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    org.springdoc: ${LOGGING_LEVEL_SPRINGDOC:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_HIBERNATE_PARAM:TRACE}
    org.springframework.kafka: DEBUG
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/identity-service.log
    max-size: 10MB
    max-history: 30


# Resilience4j (Circuit Breaker, Retry, Rate Limiter - optional)
resilience4j:
  circuitbreaker:
    instances:
      database:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      externalService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException

# Cache Configuration
cache:
  type: redis
  redis:
    time-to-live: 600000
    cache-null-values: false
  caffeine:
    spec: maximumSize=500,expireAfterWrite=600s

# Scheduling (if using @Scheduled)
task:
  scheduling:
    pool:
      size: 5
    thread-name-prefix: identity-scheduler-
  execution:
    pool:
      core-size: 5
      max-size: 20
      queue-capacity: 100
    thread-name-prefix: identity-async-


# HTTP Client
http:
  client:
    timeout:
      connect: 5000
      read: 10000
    max-connections: 100
    max-connections-per-route: 50

grpc:
  server:
    port: 9090
    security:
      enabled: ${GRPC_TLS_ENABLED:false}
      certificate-chain: ${GRPC_SERVER_CERT:}
      private-key: ${GRPC_SERVER_KEY:}
      trust-cert-collection: ${GRPC_TRUST_CERT:}
  client:
    identity-service:
      address: 'static://localhost:9090'
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
      security:
        enabled: ${GRPC_TLS_ENABLED:false}
        trust-cert-collection: ${GRPC_TRUST_CERT:}
        client-cert-chain: ${GRPC_CLIENT_CERT:}
        client-private-key: ${GRPC_CLIENT_KEY:}
    notifications-service:
      address: 'static://localhost:9090'
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
      security:
        enabled: ${GRPC_TLS_ENABLED:false}
        trust-cert-collection: ${GRPC_TRUST_CERT:}
        client-cert-chain: ${GRPC_CLIENT_CERT:}
        client-private-key: ${GRPC_CLIENT_KEY:}
  notifications:
    deadline-ms: 10000
    keep-alive-time: 30s
    keep-alive-timeout: 5s

eureka:
  client:
    enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

order:
  service:
    grpc:
      host: ${ORDER_SERVICE_GRPC_HOST}
      port: ${ORDER_SERVICE_GRPC_PORT}
