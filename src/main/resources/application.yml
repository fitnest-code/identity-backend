server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework
  http2:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200
    uri-encoding: UTF-8
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json,text/html,application/xml,application/vnd.oai.openapi+json

spring:
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  application:
    name: identity-backend   # ✅ Changed from identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP-Identity
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000
      keep-alive-time: 60000
      leak-detection-threshold: 2000
      auto-commit: true
      connection-test-query: SELECT 1
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 5
        preparedStatementCacheQueries: 250
        preparedStatementCacheSizeMiB: 10
        tcpKeepAlive: true
        binaryTransfer: true
        socketTimeout: 30
        connectTimeout: 10
        loginTimeout: 5

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        connection:
          provider_disables_autocommit: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: identity-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
      linger-ms: 5

  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC
    serialization:
      indent-output: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:500}
            read-timeout: ${FEIGN_READ_TIMEOUT:2000}
            logger-level: BASIC

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:} # Can be a comma-separated list of IDs (e.g. for Debug, Release)
  apple:
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
  token:
    hash-pepper: ${AUTH_TOKEN_HASH_PEPPER:}
  account-lock:
    max-failed-attempts: ${AUTH_ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_ACCOUNT_LOCK_LOCK_DURATION_MINUTES:30}
  reactivation:
    window-days: ${AUTH_REACTIVATION_WINDOW_DAYS:30}

springdoc:
  server-url: ${SPRINGDOC_SERVER_URL:}
  api-docs:
    path: /v3/api-docs
    enabled: true
    cache:
      enabled: true
  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    syntax-highlight:
      activated: false
    deep-linking: false
    persist-authorization: true
    disable-swagger-default-url: true
    validator-url: none
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false
  pre-loading-enabled: true
  model-converters:
    deprecating-converter:
      enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

otp:
  ttl-seconds: 180
  resend-cooldown-seconds: 60
  max-verify-attempts: 5
  session-lock-seconds: 600
  rate-limit:
    daily-max-attempts: 10
    min-cooldown-seconds: 60
    error-message-threshold-seconds: 30
  key-builder:
    pepper: ${OTP_KEY_BUILDER_PEPPER:change-me-in-production-pepper-123}

# ✅ Updated to user-backend
user:
  backend:
    url: ${USER_BACKEND_URL:http://user-backend:8080}

app:
  security:
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
    brute-force:
      max-attempts: 5
      lockout-minutes: 15
  cache:
    ttl:
      user: 300
      roles: 600
      permissions: 1800
  rate-limit:
    enabled: true
    login:
      max-attempts: 5
      window-minutes: 15
    api:
      max-requests: 1000
      window-seconds: 3600
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    db: ${APP_WARMUP_DB:true}
    jwks: ${APP_WARMUP_JWKS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://161.97.183.7,http://localhost}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    metrics:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${KUBERNETES_NAMESPACE:default}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    az.fitnest: DEBUG
    az.fitnest.identity: ${LOGGING_LEVEL_AZ_FITNEST_IDENTITY:INFO}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    org.springdoc: ${LOGGING_LEVEL_SPRINGDOC:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_HIBERNATE_PARAM:TRACE}
    org.springframework.kafka: DEBUG
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/identity-backend.log   # You may optionally rename this file to identity-backend.log
    max-size: 10MB
    max-history: 30

resilience4j:
  circuitbreaker:
    instances:
      database:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      externalService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException

cache:
  type: redis
  redis:
    time-to-live: 600000
    cache-null-values: false
  caffeine:
    spec: maximumSize=500,expireAfterWrite=600s

task:
  scheduling:
    pool:
      size: 5
    thread-name-prefix: identity-scheduler-
  execution:
    pool:
      core-size: 5
      max-size: 20
      queue-capacity: 100
    thread-name-prefix: identity-async-

http:
  client:
    timeout:
      connect: 5000
      read: 10000
    max-connections: 100
    max-connections-per-route: 50

grpc:
  server:
    port: 9090
    security:
      enabled: ${GRPC_TLS_ENABLED:false}
      certificate-chain: ${GRPC_SERVER_CERT:}
      private-key: ${GRPC_SERVER_KEY:}
      trust-cert-collection: ${GRPC_TRUST_CERT:}
  client:
    identity-backend: # This is self-reference, unchanged
      address: 'static://localhost:9090'
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
      security:
        enabled: ${GRPC_TLS_ENABLED:false}
        trust-cert-collection: ${GRPC_TRUST_CERT:}
        client-cert-chain: ${GRPC_CLIENT_CERT:}
        client-private-key: ${GRPC_CLIENT_KEY:}
    # ✅ Updated to notifications-backend
    notifications-backend:
      address: ${NOTIFICATIONS_BACKEND_GRPC_ADDRESS}
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
      security:
        enabled: ${GRPC_TLS_ENABLED:false}
        trust-cert-collection: ${GRPC_TRUST_CERT:}
        client-cert-chain: ${GRPC_CLIENT_CERT:}
        client-private-key: ${GRPC_CLIENT_KEY:}
    # ✅ Updated to order-backend
    order-backend:
      address: ${ORDER_BACKEND_GRPC_ADDRESS}
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
    # ✅ Updated to user-backend
    user-backend:
      address: ${USER_BACKEND_GRPC_ADDRESS}
      negotiation-type: ${GRPC_CLIENT_NEGOTIATION:plaintext}
  notifications:
    deadline-ms: 10000
    keep-alive-time: 30s
    keep-alive-timeout: 5s

eureka:
  client:
    enabled: false

flyway:
  enabled: true
  locations: classpath:db/migration