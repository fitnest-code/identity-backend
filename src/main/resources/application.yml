# values.yaml for IAM Service Helm chart

replicaCount: 1

# Docker image configuration
image:
  repository: ghcr.io/fitnest-backend/iam-service
  tag: "fec39c6" # CI/CD will update this
  pullPolicy: IfNotPresent

# Image pull secrets for private registry
imagePullSecrets:
  - name: ghcr-secret

# Kubernetes service
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

# Resource requests and limits
resources:
  limits:
    cpu: "1000m"
    memory: "1Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# ============ DATABASE CONFIGURATION ============
# DISABLE PostgreSQL subchart since you already have iam-db service
postgresql:
  enabled: false

# ============ ENVIRONMENT VARIABLES ============
env:
  # ============ SERVER & APPLICATION ============
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_APPLICATION_NAME
    value: "iam-service"
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  
  # ============ DATABASE CONFIGURATION ============
  # Use existing iam-db service (ClusterIP with None means headless service)
  # The pod name will be iam-db-0, so use the pod DNS: iam-db-0.iam-db.fitnest-dev.svc.cluster.local
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://iam-db-0.iam-db.fitnest-dev.svc.cluster.local:5432/iamdb"
  - name: SPRING_DATASOURCE_USERNAME
    value: "iam_user"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "iam_password"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  
  # ============ TEMPORARY HEALTH CHECK FIX ============
  - name: MANAGEMENT_HEALTH_DB_ENABLED
    value: "false"
  - name: MANAGEMENT_HEALTH_REDIS_ENABLED
    value: "false"
  - name: MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED
    value: "false"
  - name: MANAGEMENT_HEALTH_READINESS_STATE_ENABLED
    value: "false"
  
  # ============ REDIS CONFIGURATION ============
  - name: REDIS_HOST
    value: "redis-simple.fitnest-dev.svc.cluster.local"
  - name: REDIS_PORT
    value: "6379"
  
  # ============ JWT CONFIGURATION ============
  - name: JWT_SECRET
    value: "fitnest_jwt_secret_key_at_least_32_characters_long_for_hs256"
  - name: JWT_ISSUER
    value: "fitnest"
  - name: JWT_ACCESS_TTL_SECONDS
    value: "3600"
  - name: JWT_REFRESH_TTL_SECONDS
    value: "604800"
  
  # ============ SECURITY CONFIGURATION ============
  - name: SECURITY_REDIS_ACCESS_TOKEN_PREFIX
    value: "auth:token:access:"
  
  # ============ AUTH CONFIGURATION ============
  - name: AUTH_REGISTRATION_TOKEN_PREFIX
    value: "auth:registration:"
  - name: AUTH_REGISTRATION_TOKEN_TTL_HOURS
    value: "24"
  - name: AUTH_RESET_PASSWORD_TOKEN_PREFIX
    value: "auth:reset-password:"
  - name: AUTH_RESET_PASSWORD_TOKEN_TTL_HOURS
    value: "1"
  
  # ============ OAUTH CONFIGURATION ============
  - name: AUTH_GOOGLE_CLIENT_ID
    value: ""
  - name: AUTH_APPLE_CLIENT_ID
    value: ""
  - name: AUTH_APPLE_TEAM_ID
    value: ""
  
  # ============ ACCOUNT LOCK CONFIGURATION ============
  - name: AUTH_ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS
    value: "5"
  - name: AUTH_ACCOUNT_LOCK_DURATION_MINUTES
    value: "30"
  
  # ============ OTP CONFIGURATION ============
  - name: OTP_TTL_SECONDS
    value: "300"
  - name: OTP_RESEND_COOLDOWN_SECONDS
    value: "60"
  - name: OTP_MAX_VERIFY_ATTEMPTS
    value: "5"
  - name: OTP_RATE_LIMIT_MAX_ATTEMPTS
    value: "3"
  - name: OTP_RATE_LIMIT_WINDOW_MINUTES
    value: "5"
  - name: OTP_RATE_LIMIT_COOLDOWN_SECONDS
    value: "30"
  - name: OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS
    value: "30"
  - name: OTP_RATE_LIMIT_ERROR_THRESHOLD_SECONDS
    value: "60"
  
  # ============ SERVICE DISCOVERY ============
  - name: USER_SERVICE_URL
    value: "http://user-service.fitnest-dev.svc.cluster.local:9897"
  
  # ============ EUREKA CONFIGURATION ============
  - name: EUREKA_CLIENT_ENABLED
    value: "false"
  
  # ============ ACTUATOR CONFIGURATION ============
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "health,info,prometheus,metrics"
  - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
    value: "when-authorized"
  - name: MANAGEMENT_HEALTH_PING_ENABLED
    value: "true"
  
  # ============ MAIL CONFIGURATION ============
  - name: MAIL_HOST
    value: "smtp.gmail.com"
  - name: MAIL_PORT
    value: "587"
  - name: MAIL_USERNAME
    value: ""
  - name: MAIL_PASSWORD
    value: ""

# ============ INIT CONTAINERS ============
# Wait for database to be ready
initContainers:
  - name: wait-for-db
    image: busybox:1.35
    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for PostgreSQL database to be ready..."
        until nc -z iam-db-0.iam-db.fitnest-dev.svc.cluster.local 5432; do
          echo "Database not ready yet. Waiting..."
          sleep 5
        done
        echo "PostgreSQL database is ready!"

# ============ HEALTH PROBES ============
probes:
  enabled: true
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 180  # Increased for database initialization
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 15  # Longer period for startup
    failureThreshold: 20  # Allow more time for database

# ============ ISTIO INTEGRATION ============
istio:
  enabled: true
  sidecarInject: true

# ============ VOLUMES FOR LOGS ============
volumes:
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: logs
    mountPath: /app/logs

# ============ POD SECURITY ============
securityContext:
  pod:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
  container:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL

# ============ NODE SCHEDULING ============
nodeSelector: {}
tolerations: []
affinity: {}

# ============ AUTOSCALING ============
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# ============ ADDITIONAL ANNOTATIONS ============
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"
