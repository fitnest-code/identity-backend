server:
  port: 8080
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: iam-service

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitnest_iam}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_iam}
    password: ${SPRING_DATASOURCE_PASSWORD:iam_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  # JPA
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

# SpringDoc OpenAPI (Swagger)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    operationsSorter: method
    tagsSorter: alpha

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# OTP Configuration
otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
  length: ${OTP_LENGTH:6}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    az.fitnest.iam: ${LOGGING_LEVEL_AZ_FITNEST_IAM:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:DEBUG}