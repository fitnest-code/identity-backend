server:
  port: 8080

spring:
  application:
    name: iam-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://iam-db:5432/iamdb}
    username: ${SPRING_DATASOURCE_USERNAME:iam_user}
    password: ${SPRING_DATASOURCE_PASSWORD:iam_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ============ EUREKA CONFIGURATION ============
# Enable Eureka client for service registration and discovery
# Default: false - set to true if using Eureka server
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
  
  instance:
    hostname: ${HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
# ==============================================

jwt:
  secret: ${JWT_SECRET:fitnest_jwt_secret_key_at_least_32_characters_long_for_hs256}
  issuer: ${JWT_ISSUER:fitnest}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

security:
  redis:
    access-token-prefix: ${SECURITY_REDIS_ACCESS_TOKEN_PREFIX:auth:token:access:}

auth:
  registration-token:
    prefix: ${AUTH_REGISTRATION_TOKEN_PREFIX:auth:registration:}
    ttl-hours: ${AUTH_REGISTRATION_TOKEN_TTL_HOURS:24}
  reset-password-token:
    prefix: ${AUTH_RESET_PASSWORD_TOKEN_PREFIX:auth:reset-password:}
    ttl-hours: ${AUTH_RESET_PASSWORD_TOKEN_TTL_HOURS:1}
  google:
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
  apple:
    client-id: ${AUTH_APPLE_CLIENT_ID:}
    team-id: ${AUTH_APPLE_TEAM_ID:}
  account-lock:
    max-failed-attempts: ${AUTH_ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_ACCOUNT_LOCK_DURATION_MINUTES:30}

otp:
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:5}
  rate-limit:
    max-attempts: ${OTP_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${OTP_RATE_LIMIT_WINDOW_MINUTES:5}
    cooldown-seconds: ${OTP_RATE_LIMIT_COOLDOWN_SECONDS:30}
    min-cooldown-seconds: ${OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS:30}
    error-message-threshold-seconds: ${OTP_RATE_LIMIT_ERROR_THRESHOLD_SECONDS:60}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:9897}

# ============ SPRING BOOT ACTUATOR & MONITORING ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  
  endpoint:
    health:
      show-details: when-authorized
      # Enable health groups for Kubernetes
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    
  # Health indicators configuration
  health:
    # Enable/disable specific health indicators
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true
    
    # Configure health groups
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
  
  # Micrometer metrics configuration for Prometheus
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      system: true
      tomcat: true
      logback: true
      hibernate: true
      jpa: true
      http: true
      redis: true
      postgres: true
  
  # Application info exposure
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: simple

# ============ LOGGING CONFIGURATION ============
# Structured logging for better integration with monitoring tools
logging:
  level:
    org.springframework.security: INFO
    com.fitnest: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/iam-service.log
    max-size: 10MB
    max-history: 30
  
  # Logback configuration for JSON logging (optional - for ELK/Grafana)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  
  # Micrometer metrics for logging
  metrics:
    enabled: true
# ==============================================

# ============ ADDITIONAL METRICS CONFIGURATION ============
# Prometheus scrape endpoint will be available at: http://localhost:8080/actuator/prometheus
# Grafana dashboard can be configured to scrape metrics from this endpoint

# To enable distributed tracing (optional):
# spring.sleuth.enabled: true
