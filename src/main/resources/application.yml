server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024



  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fitnest_iam}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_iam}
    password: ${SPRING_DATASOURCE_PASSWORD:iam_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 5
      maximum-pool-size: 20
      pool-name: HikariCP-IAM

  # JPA
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Mail
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Security
  security:
    oauth2:
      client:
        registration:
          # Add social login providers if needed
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

# SpringDoc OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # Swagger UI customization
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    # Dynamic URLs for Istio routing
    config-url: ${SPRINGDOC_SWAGGER_UI_CONFIG_URL:/v3/api-docs/swagger-config}
    url: ${SPRINGDOC_SWAGGER_UI_URL:/v3/api-docs}
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # Grouping APIs (optional)
  group-configs:
    - group: v1
      paths-to-match: /api/v1/**
      packages-to-scan: az.fitnest.iam.controller.v1

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:iam-service}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  # Remove expiration if not used
  # expiration: ${JWT_EXPIRATION:86400000}

# OTP Configuration (simplified - remove duplicates)
otp:
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:3}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  rate-limit:
    max-attempts: ${OTP_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${OTP_RATE_LIMIT_WINDOW_MINUTES:15}
    cooldown-seconds: ${OTP_RATE_LIMIT_COOLDOWN_SECONDS:60}
    min-cooldown-seconds: ${OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS:5}
    error-message-threshold-seconds: ${OTP_RATE_LIMIT_ERROR_MESSAGE_THRESHOLD_SECONDS:30}

# Application-specific configurations
app:
  # Security
  security:
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: true
    brute-force:
      max-attempts: 5
      lockout-minutes: 15

  # Cache
  cache:
    ttl:
      user: 300
      roles: 600
      permissions: 1800

  # Rate limiting
  rate-limit:
    enabled: true
    login:
      max-attempts: 5
      window-minutes: 15
    api:
      max-requests: 1000
      window-seconds: 3600

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
      base-path: /actuator
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://161.97.183.7,http://localhost}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${KUBERNETES_NAMESPACE:default}

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    az.fitnest.iam: ${LOGGING_LEVEL_AZ_FITNEST_IAM:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:DEBUG}
    org.springdoc: ${LOGGING_LEVEL_SPRINGDOC:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_HIBERNATE_PARAM:TRACE}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/iam-service.log
    max-size: 10MB
    max-history: 30

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://161.97.183.7,http://localhost}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

# Resilience4j (Circuit Breaker, Retry, Rate Limiter - optional)
resilience4j:
  circuitbreaker:
    instances:
      database:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      externalService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException

# Cache Configuration
cache:
  type: redis
  redis:
    time-to-live: 600000
    cache-null-values: false
  caffeine:
    spec: maximumSize=500,expireAfterWrite=600s

# Scheduling (if using @Scheduled)
task:
  scheduling:
    pool:
      size: 5
    thread-name-prefix: iam-scheduler-
  execution:
    pool:
      core-size: 5
      max-size: 20
      queue-capacity: 100
    thread-name-prefix: iam-async-

# Validation
spring:
  application:
    name: iam-service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# HTTP Client
http:
  client:
    timeout:
      connect: 5000
      read: 10000
    max-connections: 100
    max-connections-per-route: 50