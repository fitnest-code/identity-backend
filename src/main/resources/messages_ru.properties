# Validation Errors
error.validation = Произошла ошибка при проверке данных
error.validation.invalid_field = Предоставленные  данные недействительны
error.validation.missing_field = Необходимая информация не была предоставлена
error.validation.out_of_range = Значение выходит за допустимые пределы
error.validation.invalid_format = Неверный формат данных
error.validation.null_constraint = Отсутствует необходимая информация

# Authentication Errors
error.auth.unauthorized = Пожалуйста, войдите в систему, чтобы продолжить
error.auth.invalid_credentials = Неверные данные для входа
error.auth.token_expired = Срок действия сессии истек. Пожалуйста, войдите снова
error.auth.account_restricted = Доступ к аккаунту временно ограничен
error.auth.account_inactive = Данный аккаунт в настоящее время не доступен

# Authorization Errors
error.authorization.forbidden = У вас нет прав для выполнения этого действия
error.authorization.access_denied = Доступ запрещен

# Request Format Errors
error.request.invalid = Неверный запрос
error.request.invalid_json = Неверный формат JSON
error.request.unsupported_media_type = Неподдерживаемый тип медиа
error.request.method_not_allowed = Этот HTTP-метод не поддерживается
error.request.timeout = Время ожидания запроса истекло

# Server Errors
error.server.internal = Произошла техническая ошибка. Пожалуйста, попробуйте позже
error.server.unavailable = Сервис в настоящее время недоступен
error.server.unexpected = Произошла непредвиденная ошибка
error.server.maintenance = Сервис временно находится на техническом обслуживании

# Resource Errors
error.resource.not_found = Запрошенная информация не найдена
error.resource.already_exists = Эта информация уже существует
error.resource.conflict = Обнаружен конфликт данных
error.resource.operation_failed = Невозможно выполнить операцию с предоставленными данными

# Rate Limiting Errors
error.rate_limit.too_many_requests = Отправлено слишком много запросов. Пожалуйста, подождите
error.rate_limit.exceeded = Превышен лимит запросов

# Service Specific Errors
error.service.operation_not_allowed = Выполнение операции невозможно с предоставленными данными
error.service.account_unavailable = Учетная запись в настоящее время недоступна
error.service.additional_verification_required = Для продолжения требуется дополнительная проверка
error.service.password_min_length = Пароль должен содержать не менее 8 символов
error.service.password_must_be_different = Новый пароль должен отличаться от предыдущего
info.service.request_processed = Если предоставленная информация существует, запрос обработан
error.service.external_auth_error = Ошибка при подключении к внешней службе входа
error.service.external_service_unavailable = Не удалось подключиться к внешнему сервису
error.service.transaction_error = Произошла ошибка во время операции
error.service.data_integrity = Произошла ошибка при обработке данных
error.service.identity_not_verified = Предоставлення информация не может быть подтверждена
error.service.invalid_operation_context = Эта операция не может быть выполнена в данном контексте
error.service.missing_email = Должен быть указан email
error.service.missing_mobile = Должен быть указан номер мобильного телефона

# OTP Messages
success.otp.sent = Код подтверждения отправлен
success.otp.sent_if_exists = Если предоставленная информация существует в системе, код подтверждения отправлен
error.otp.invalid = Код подтверждения неверен или истек
error.otp.locked = Подтверждение временно ограничено из-за слишком большого количества неудачных попыток
error.otp.already_verified = Код подтверждения уже был использован
success.otp.verified = Подтверждение прошло успешно
error.otp.rate_limit_seconds = Пожалуйста, подождите {0} секунд перед повторным запросом кода
error.otp.rate_limit_minutes = Слишком много запросов кода. Пожалуйста, попробуйте через {0} минут
error.otp.rate_limit_generic = Слишком много запросов. Пожалуйста, попробуйте позже

# Success Messages
success.auth.logout = Выход выполнен успешно
success.password.changed = Пароль успешно изменен
success.account.deactivated = Аккаунт успешно деактивирован
