# Validation Errors
error.validation = Произошла ошибка валидации данных
error.invalid_field = Введенные данные неверны
error.missing_field = Не все обязательные данные заполнены
error.out_of_range = Введенные данные выходят за допустимый диапазон
error.invalid_format = Неверный формат данных

# Authentication Errors
error.unauthorized = Пожалуйста, войдите в систему, чтобы продолжить
error.invalid_credentials = Неверное имя пользователя или пароль
error.token_expired = Время сессии истекло. По пожалуйста, войдите снова
error.account_locked = Ваша учетная запись временно заблокирована
error.account_disabled = Ваша учетная запись деактивирована

# Authorization Errors
error.forbidden = У вас нет прав для выполнения этого действия
error.access_denied = Доступ запрещен

# Request Format Errors
error.invalid_request = Неверный запрос
error.invalid_json_format = Неверный формат запроса
error.unsupported_media_type = Неподдерживаемый тип медиа
error.method_not_allowed = Этот метод не поддерживается

# Server Errors
error.internal_server_error = Приносим извинения за техническую ошибку. Пожалуйста, попробуйте позже
error.service_unavailable = Сервис временно недоступен
error.unexpected = Произошла непредвиденная ошибка

# Resource Errors
error.resource_not_found = Данные не найдены
error.resource_already_exists = Данные уже существуют
error.resource_conflict = Возник конфликт данных

# Rate Limiting Errors
error.too_many_requests = Слишком много запросов. Пожалуйста, подождите
error.rate_limit_exceeded = Дневной лимит исчерпан

# Service Specific Errors
error.duplicate_mobile = Этот номер мобильного телефона уже зарегистрирован
error.duplicate_email = Этот электронный адрес уже зарегистрирован
error.account_deactivated = Ваша учетная запись деактивирована
error.reactivation_required = Для входа требуется дополнительное подтверждение. Пожалуйста, введите код безопасности.
error.password_min_length = Пароль должен быть не менее 8 символов
error.password_must_be_different = Новый пароль должен отличаться от старого
error.password_reset_success = Пароль успешно сброшен.
error.invalid_google_token = Произошла ошибка при входе через Google
error.invalid_apple_token = Произошла ошибка при входе через Apple
error.apple_public_key_error = Не удалось связаться с сервисом Apple
error.otp_rate_limited = Слишком много попыток. Пожалуйста, подождите
error.transaction_error = Ошибка во время выполнения транзакции
error.data_integrity = Ошибка целостности данных
error.null_constraint = Обязательные данные отсутствуют
error.user_not_found = Пользователь не найден
error.invalid_otp_purpose = Неверное назначение OTP
error.missing_email = Электронная почта должна быть указана
error.missing_mobile = Мобильный номер должен быть указан
# OTP Messages
error.otp_sent = Код подтверждения отправлен.
error.otp_sent_if_exists = Если указанный мобильный номер существует в системе, код подтверждения отправлен.
error.invalid_otp = Неверный OTP код
error.otp_locked = OTP-сессия заблокирована из-за слишком большого количества неудачных попыток. Пожалуйста, запросите новый код.
error.otp_already_verified = OTP-код уже подтвержден. Пожалуйста, запросите новый.
error.otp_verified = OTP успешно подтвержден.
error.otp_rate_limit_seconds = Пожалуйста, подождите {0} секунд перед повторным запросом OTP.
error.otp_rate_limit_minutes = Слишком много запросов OTP. Пожалуйста, попробуйте снова через {0} минут.
error.otp_rate_limit_generic = Слишком много запросов. Пожалуйста, попробуйте позже.
