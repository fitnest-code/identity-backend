error.validation = Произошла ошибка при проверке данных
error.validation.invalid_field = Предоставленные данные недействительны
error.validation.missing_field = Необходимая информация не была предоставлена
error.validation.out_of_range = Указанное значение выходит за допустимый диапазон
error.validation.invalid_format = Неверный формат данных
error.validation.null_constraint = Необходимая информация отсутствует

error.auth.unauthorized = Пожалуйста, войдите в систему для продолжения
error.auth.invalid_credentials = Неверные учетные данные для входа
error.auth.token_expired = Срок действия сессии истек. Пожалуйста, войдите снова
error.auth.account_restricted = Доступ к учетной записи временно ограничен
error.auth.account_inactive = Учетная запись в настоящее время неактивна
error.auth.invalid_header = Неверный заголовок авторизации

error.authorization.forbidden = У вас нет разрешения на выполнение этого действия
error.authorization.access_denied = Доступ запрещен

error.request.invalid = Неверный запрос
error.request.invalid_json = Неверный формат JSON
error.request.unsupported_media_type = Неподдерживаемый тип медиа
error.request.method_not_allowed = Этот метод HTTP не поддерживается
error.request.timeout = Время ожидания запроса истекло

error.server.internal = Произошла техническая ошибка. Пожалуйста, попробуйте позже
error.server.unavailable = Сервис в настоящее время недоступен
error.server.unexpected = Произошла непредвиденная ошибка
error.server.maintenance = Сервис временно находится на техническом обслуживании

error.resource.not_found = Запрашиваемая информация не найдена
error.resource.already_exists = Эта информация уже существует
error.resource.conflict = Обнаружен конфликт данных
error.resource.operation_failed = Не удалось выполнить операцию с предоставленными данными

error.rate_limit.too_many_requests = Отправлено слишком много запросов. Пожалуйста, подождите
error.rate_limit.exceeded = Превышен лимит запросов

error.service.operation_not_allowed = Операция с предоставленными данными невозможна
error.service.account_unavailable = Учетная запись в настоящее время недоступна
error.service.additional_verification_required = Для продолжения требуется дополнительная проверка
error.service.password_min_length = Пароль должен содержать не менее 8 символов
error.service.password_must_be_different = Новый пароль должен отличаться от текущего
info.service.request_processed = Если предоставленная информация существует в нашей системе, запрос был обработан
error.service.external_auth_error = Произошла ошибка при аутентификации во внешней службе
error.service.external_service_unavailable = Не удалось подключиться к внешней службе
error.service.transaction_error = Произошла ошибка во время выполнения транзакции
error.service.data_integrity = Произошла ошибка при обработке данных
error.service.identity_not_verified = Предоставленные данные не могут быть подтверждены
error.service.invalid_operation_context = Эту операцию нельзя выполнить в текущем состоянии
error.service.missing_email = Необходимо предоставит email
error.service.missing_mobile = Необходимо предоставить номер мобильного телефона

success.otp.sent = Код подтверждения отправлен
success.otp.sent_if_exists = Если предоставленная информация существует в нашей системе, код подтверждения был отправлен
error.otp.invalid = Код подтверждения неверен или его срок действия истек
error.otp.locked = Подтверждение временно ограничено из-за слишком большого количества неудачных попыток
error.otp.already_verified = Код подтверждения уже был использован
success.otp.verified = Подтверждение прошло успешно
error.otp.rate_limit_seconds = Пожалуйста, подождите {0} секунд перед запросом нового кода
error.otp.rate_limit_minutes = Слишком много запросов на подтверждение. Пожалуйста, попробуйте через {0} минут
error.otp.rate_limit_generic = Слишком много запросов. Пожалуйста, попробуйте позже

success.auth.logout = Выход выполнен успешно
success.password.changed = Пароль успешно изменен
success.account.deactivated = Учетная запись успешно деактивирована
