# Validation Errors
error.validation = An error occurred during data validation
error.invalid_field = The provided data is invalid
error.missing_field = A required field is missing
error.out_of_range = The provided value is outside the allowed range
error.invalid_format = Invalid data format

# Authentication Errors
error.unauthorized = Please log in to continue
error.invalid_credentials = Invalid login credentials
error.token_expired = The session has expired. Please log in again
error.account_locked = Your account has been temporarily locked
error.account_disabled = Your account is not active

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = Invalid JSON format in request
error.unsupported_media_type = Unsupported media type
error.method_not_allowed = This HTTP method is not supported

# Server Errors
error.internal_server_error = A technical error occurred. Please try again later
error.service_unavailable = The service is temporarily unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = Data not found
error.resource_already_exists = This data already exists
error.resource_conflict = A data conflict occurred

# Rate Limiting Errors
error.too_many_requests = Too many requests were sent. Please wait a moment
error.rate_limit_exceeded = Request limit exceeded

# Service Specific Errors
error.duplicate_mobile = The operation could not be completed with the provided information
error.duplicate_email = The operation could not be completed with the provided information
error.account_deactivated = Your account has been deactivated
error.reactivation_required = Additional verification is required to continue
error.password_min_length = Password must contain at least 8 characters
error.password_must_be_different = The new password must be different from the previous one
error.password_reset_success = If the account exists, the password has been updated
error.invalid_google_token = An error occurred during external login
error.invalid_apple_token = An error occurred during external login
error.apple_public_key_error = Unable to connect to the external service
error.otp_rate_limited = Too many attempts. Please try again later
error.transaction_error = An error occurred during the transaction
error.data_integrity = A data integrity error occurred
error.null_constraint = Required data is missing
error.user_not_found = The provided information could not be verified
error.invalid_otp_purpose = Invalid OTP purpose
error.missing_email = Email must be provided
error.missing_mobile = Mobile number must be provided

# OTP Messages
error.otp_sent = If the information exists in the system, a verification code has been sent
error.otp_sent_if_exists = If the provided information exists in the system, a verification code has been sent
error.invalid_otp = The verification code is invalid or expired
error.otp_locked = The verification process has been temporarily locked due to too many failed attempts
error.otp_already_verified = The verification code has already been used. Please request a new one
error.otp_verified = Verification completed successfully
error.otp_rate_limit_seconds = Please wait {0} seconds before requesting another code
error.otp_rate_limit_minutes = Too many OTP requests. Please try again after {0} minutes
error.otp_rate_limit_generic = Too many requests. Please try again later