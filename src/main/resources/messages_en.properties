# Validation Errors
error.validation = A validation error occurred
error.invalid_field = The provided field is invalid
error.missing_field = A required field is missing
error.out_of_range = The provided value is out of range
error.invalid_format = Invalid data format

# Authentication Errors
error.unauthorized = Please login to continue
error.invalid_credentials = Invalid username or password
error.token_expired = Session expired. Please login again
error.account_locked = Your account has been temporarily locked
error.account_disabled = Your account is disabled

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = The request format is incorrect
error.unsupported_media_type = Unsupported media type
error.method_not_allowed = This method is not allowed

# Server Errors
error.internal_server_error = Something went wrong on our end. Please try again later
error.service_unavailable = Service is temporarily unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = Information not found
error.resource_already_exists = This information already exists
error.resource_conflict = A data conflict occurred

# Rate Limiting Errors
error.too_many_requests = Too many requests. Please wait a moment
error.rate_limit_exceeded = Daily limit exceeded

# Service Specific Errors
error.duplicate_mobile = This mobile number is already registered
error.duplicate_email = This email is already registered
error.account_deactivated = Your account has been deactivated
error.reactivation_required = Additional verification is required for login. Please enter the security code.
error.password_min_length = Password must be at least 8 characters long
error.password_must_be_different = New password must be different from old password
error.password_reset_success = Password successfully reset.
error.invalid_google_token = An error occurred during Google login
error.invalid_apple_token = An error occurred during Apple login
error.apple_public_key_error = Could not connect to Apple service
error.otp_rate_limited = Too many attempts. Please wait
error.transaction_error = An error occurred during the transaction
error.data_integrity = A data integrity error occurred
error.null_constraint = Required information is missing
error.user_not_found = User not found
error.invalid_otp_purpose = Invalid OTP purpose
error.missing_email = Email must be provided
error.missing_mobile = Mobile number must be provided
# OTP Messages
error.otp_sent = Verification code sent.
error.otp_sent_if_exists = If the provided mobile number exists in the system, a verification code has been sent.
error.invalid_otp = Invalid OTP code
error.otp_locked = OTP session locked due to too many failed attempts. Please request a new code.
error.otp_already_verified = OTP code already verified. Please request a new one.
error.otp_verified = OTP successfully verified.
error.otp_rate_limit_seconds = Please wait {0} seconds before requesting a new OTP.
error.otp_rate_limit_minutes = Too many OTP requests. Please try again after {0} minutes.
error.otp_rate_limit_generic = Too many requests. Please try again later.
